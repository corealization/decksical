name: Release wheel

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  UV_PYTHON: "3.11"

jobs:
  wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.UV_PYTHON }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          with Path("pyproject.toml").open("rb") as file:
              metadata = tomllib.load(file)
          version = metadata["project"]["version"]
          if os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit(f"Release tag must match package version: v{version}")
          PY
      - name: Build wheel
        run: uv build --wheel
      - name: Check release wheel in a clean environment
        run: python -m unittest discover -s tests -p test_package.py -v
      - name: Create draft release with wheel
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          PACKAGE_VERSION: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.whl --draft --title "Decksical ${PACKAGE_VERSION#v}" --generate-notes --repo "$GITHUB_REPOSITORY"
