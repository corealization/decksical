[project]
site_url = "https://decksical.corealization.com"
site_name = "Decksical"
site_description = "A simple Zensical theme for authoring presentation slides as Markdown files"
site_author = "Alex Voss"

copyright = "Copyright &copy; 2026 Alex Voss"

repo_url = "https://github.com/corealization/decksical"
repo_name = "corealization/decksical"

nav = [
  { "Home" = "index.md" },
  { "Installation" = "installation.md" },
  { "Get started" = "getting-started.md" },
  { "Authoring" = "authoring.md" },
  { "Presenting" = "presenting.md" },
  { "Example slides" = [
    { "Overview" = "example/index.md" },
    { "Welcome" = "example/title.md" },
    { "Presentations with Zensical" = "example/welcome.md" },
    { "Make your own deck" = "example/closing.md" },
    { "Author a slide" = "example/content.md" },
    { "Code blocks" = "example/code.md" },
    { "Mermaid diagrams" = "example/diagrams.md" },
    { "Full-size image" = "example/image.md" },
    { "Image on the left" = "example/image-text.md" },
    { "Image on the right" = "example/image-text-right.md" },
    { "Two columns" = "example/columns.md" },
    { "Use maths" = "example/maths.md" },
    { "Speaker notes" = "example/notes.md" },
  ] },
  { "How the theme works" = "how-it-works.md" },
  { "Development" = "development.md" },
]

extra_css = ["assets/stylesheets/extra.css"]
extra_javascript = [
  "assets/javascripts/mathjax.js",
  "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]

[project.extra.decksical.navigation]
hide_until_hover = true

[project.theme]
name = "decksical-catppuccin"
font = false
# variant = "classic"
custom_dir = "overrides"
logo = "assets/decksical_logo.svg"
favicon = "assets/decksical_logo.svg"
language = "en"
features = [
  "announce.dismiss",
  # "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  # "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  # "navigation.sections",
  # "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]

# Cycle through Catppuccin's flavors and Zensical's light and dark palettes.
[[project.theme.palette]]
scheme = "catppuccin-latte"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to Zensical light palette"

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to Catppuccin Frappé"

[[project.theme.palette]]
scheme = "catppuccin-frappe"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to Catppuccin Macchiato"

[[project.theme.palette]]
scheme = "catppuccin-macchiato"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to Catppuccin Mocha"

[[project.theme.palette]]
scheme = "catppuccin-mocha"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to Zensical dark palette"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to Catppuccin Latte"


# [[project.extra.social]]
# icon = "fontawesome/brands/github"
# link = "https://github.com/user/repo"

# [[project.extra.social]]
# icon = "fontawesome/brands/mastodon"
# link = "https://fosstodon.org/@user"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
