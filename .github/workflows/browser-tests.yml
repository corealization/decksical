name: Browser tests

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
    inputs:
      latest_dependencies:
        description: Test the latest published Zensical and Catppuccin theme versions
        type: boolean
        default: false

permissions:
  contents: read

env:
  UV_PYTHON: "3.11"

jobs:
  test:
    name: Browser tests (${{ matrix.browser }}, ${{ matrix.theme }}, ${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
        theme: [decksical, decksical-catppuccin]
        variant: [modern, classic]
    env:
      DECKSICAL_TEST_BROWSER: ${{ matrix.browser }}
      DECKSICAL_TEST_THEME: ${{ matrix.theme }}
      DECKSICAL_TEST_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.UV_PYTHON }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Install locked dependencies
        run: uv sync --locked --extra catppuccin
      - name: Install latest Zensical and Catppuccin theme
        if: github.event_name == 'schedule' || inputs.latest_dependencies == true
        run: uv pip install --upgrade zensical catppuccin-zensical
      - name: Report Zensical version
        run: uv run --no-sync python -m zensical --version
      # Keep OS provisioning separate from Playwright's browser downloads.
      # Runtime libraries for Chromium and Firefox on Ubuntu 24.04.
      - name: Install browser OS dependencies with apt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-liberation fonts-noto-color-emoji \
            libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 libatspi2.0-0t64 \
            libavcodec60 libcairo-gobject2 libcairo2 libcups2t64 libdbus-1-3 \
            libdrm2 libfontconfig1 libfreetype6 libgbm1 libgdk-pixbuf-2.0-0 \
            libglib2.0-0t64 libgtk-3-0t64 libnspr4 libnss3 libpango-1.0-0 \
            libpangocairo-1.0-0 libx11-6 libx11-xcb1 libxcb-shm0 libxcb1 \
            libxcomposite1 libxcursor1 libxdamage1 libxext6 libxfixes3 libxi6 \
            libxkbcommon0 libxrandr2 libxrender1
      - name: Build wheel
        run: uv build --wheel
      - name: Install wheel for browser tests
        run: uv pip install --no-deps --reinstall dist/*.whl
      - name: Run browser tests
        run: uv run --no-sync python -m unittest discover -s tests -p test_slides.py -v
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-failures-${{ matrix.browser }}-${{ matrix.theme }}-${{ matrix.variant }}
          path: test-results/
          if-no-files-found: ignore
