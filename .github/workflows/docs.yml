name: Documentation

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  UV_PYTHON: "3.11"

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Manual documentation deployments must use main; releases deploy by tag.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify release commit is on main
        if: github.event_name == 'release'
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          if ! git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main; then
            echo "The release commit is not reachable from main." >&2
            exit 1
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.UV_PYTHON }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Install locked dependencies
        run: uv sync --locked --no-dev --no-editable --extra catppuccin
      - name: Build documentation
        run: uv run --no-sync zensical build --clean --strict
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
